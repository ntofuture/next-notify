<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Next Notify</title>
  <link rel="stylesheet" href="shared/fonts.css">
  <link rel="stylesheet" href="shared/card.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<canvas class="stars" id="stars" aria-hidden="true"></canvas>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="../../assets/brand/next-notify.svg" alt="">
      <span class="wordmark">next notify</span>
      <span class="crumb"><span>/</span><span data-i18n="crumb"></span></span>
    </div>
    <div></div>
    <div class="topbar-tools">
      <span class="status" id="serverStatus"><i class="dot"></i><span></span></span>
      <div class="segmented" data-path="language">
        <button data-v="tr">TR</button><button data-v="en">EN</button>
      </div>
      <div class="bell-wrap">
        <button class="bell" id="btnBell" aria-haspopup="true" aria-expanded="false" data-i18n-title="events.log">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge" id="bellBadge" hidden></span>
        </button>
        <div class="popover" id="eventsPop" hidden>
          <h3><span data-i18n="events.log"></span><button class="link" id="btnClear" data-i18n="events.clear"></button></h3>
          <ul class="log" id="log"></ul>
        </div>
      </div>
      <button class="theme-switch" id="themeSwitch" data-i18n-title="theme.toggle"><span class="orb"></span></button>
      <button id="btnSetup" aria-haspopup="dialog"><i class="state" id="setupState"></i><span data-i18n="setup.open"></span></button>
      <button id="btnReset" data-i18n="reset"></button>
      <div class="window-controls">
        <button class="win-button" data-win="minimize" data-i18n-title="window.minimize"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
        <button class="win-button" data-win="maximize" data-i18n-title="window.maximize"><svg class="max" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="2"/></svg><svg class="restore" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="7.5" height="7.5" rx="1.8"/><path d="M5.5 5.5V4.8A1.8 1.8 0 0 1 7.3 3h3.9A1.8 1.8 0 0 1 13 4.8v3.9a1.8 1.8 0 0 1-1.8 1.8h-.7"/></svg></button>
        <button class="win-button close" data-win="close" data-i18n-title="window.close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="tabs" role="tablist">
        <button data-tab="design" data-i18n="tab.design"></button>
        <button data-tab="events" data-i18n="tab.events"></button>
      </div>

      <div class="tab-panel" data-panel="design">
        <div class="panel">
          <h3 data-i18n="design.show"></h3>
          <div class="chips">
            <label class="chip"><input type="checkbox" data-path="popup.showProject"><span data-i18n="show.project"></span></label>
            <label class="chip"><input type="checkbox" data-path="popup.showIcon"><span data-i18n="show.icon"></span></label>
            <label class="chip"><input type="checkbox" data-path="popup.accentStripe"><span data-i18n="show.stripe"></span></label>
            <label class="chip"><input type="checkbox" data-path="popup.showProgress"><span data-i18n="show.progress"></span></label>
          </div>
        </div>
        <div class="panel">
          <h3 data-i18n="design.layout"></h3>
          <div class="row"><span class="label" data-i18n="design.position"></span>
            <div class="posgrid" data-path="popup.position">
              <button data-v="top-left"></button><button data-v="top-center"></button><button data-v="top-right"></button>
              <button data-v="bottom-left"></button><button data-v="bottom-center"></button><button data-v="bottom-right"></button>
            </div></div>
          <div class="row"><span class="label" data-i18n="design.duration"></span>
            <div class="inline"><input type="range" min="0" max="20" step="1" data-path="popup.duration"><output data-show="popup.duration" data-fmt="sec"></output></div></div>
          <div class="row"><span class="label" data-i18n="design.width"></span>
            <div class="inline"><input type="range" min="300" max="520" step="10" data-path="popup.width"><output data-show="popup.width" data-fmt="px"></output></div></div>
          <div class="row"><span class="label" data-i18n="design.radius"></span>
            <div class="inline"><input type="range" min="0" max="28" step="1" data-path="popup.radius"><output data-show="popup.radius" data-fmt="px"></output></div></div>
          <div class="row"><span class="label" data-i18n="design.opacity"></span>
            <div class="inline"><input type="range" min="0.6" max="1" step="0.01" data-path="popup.opacity"><output data-show="popup.opacity" data-fmt="pct"></output></div></div>
          <div class="row"><span class="label" data-i18n="design.animation"></span>
            <div class="segmented" data-path="popup.animation">
              <button data-v="slide" data-i18n="anim.slide"></button><button data-v="fade" data-i18n="anim.fade"></button><button data-v="none" data-i18n="anim.none"></button>
            </div></div>
        </div>
        <div class="panel">
          <h3 data-i18n="design.theme"></h3>
          <div class="themes" id="themes"></div>
          <h3 data-i18n="design.colors"></h3>
          <div class="colors">
            <label class="color-row"><input type="color" data-path="popup.colors.background"><span data-i18n="color.background"></span></label>
            <label class="color-row"><input type="color" data-path="popup.colors.title"><span data-i18n="color.title"></span></label>
            <label class="color-row"><input type="color" data-path="popup.colors.text"><span data-i18n="color.text"></span></label>
            <label class="color-row"><input type="color" data-path="popup.colors.muted"><span data-i18n="color.muted"></span></label>
            <label class="color-row"><input type="color" data-path="popup.colors.border"><span data-i18n="color.border"></span></label>
          </div>
          <h3 data-i18n="design.fonts"></h3>
          <div class="row"><span class="label" data-i18n="font.project"></span><select class="font-select" data-path="popup.fonts.project"></select></div>
          <div class="row"><span class="label" data-i18n="font.title"></span><select class="font-select" data-path="popup.fonts.title"></select></div>
          <div class="row"><span class="label" data-i18n="font.body"></span><select class="font-select" data-path="popup.fonts.body"></select></div>
          <div class="row"><span class="label" data-i18n="behavior.summary"></span>
            <div class="inline"><input type="range" min="40" max="300" step="10" data-path="behavior.summaryLength"><output data-show="behavior.summaryLength" data-fmt="chr"></output></div></div>
        </div>
      </div>

      <div class="tab-panel" data-panel="events">
        <div class="panel">
          <label class="switch-row">
            <span class="switch-text"><b data-i18n="general.enabled"></b><small data-i18n="general.enabled.hint"></small></span>
            <input type="checkbox" class="switch" data-path="enabled">
          </label>
          <label class="switch-row">
            <span class="switch-text"><b data-i18n="general.autostart"></b><small data-i18n="general.autostart.hint"></small></span>
            <input type="checkbox" class="switch" data-path="autostart">
          </label>
        </div>
        <div class="panel">
          <div class="segmented event-tabs" id="eventTabs"></div>
          <label class="switch-row">
            <span class="switch-text"><b data-i18n="events.enabled"></b></span>
            <input type="checkbox" class="switch" data-ev="enabled">
          </label>
          <label class="field"><span data-i18n="events.title"></span><input type="text" data-ev="title" id="evTitle"></label>
          <label class="field"><span data-i18n="events.message"></span><input type="text" data-ev="message" id="evMessage"></label>
          <div class="field"><span data-i18n="events.vars"></span><div class="vars" id="vars"></div></div>
        </div>
        <div class="panel">
          <div class="field"><span data-i18n="events.icon"></span><div class="icon-picker" id="icons"></div></div>
          <div class="field"><span data-i18n="events.accent"></span>
            <div class="accent-row"><input type="color" data-ev="accent"><div class="swatches" id="accents"></div></div></div>
          <label class="switch-row">
            <span class="switch-text"><b data-i18n="events.sticky"></b></span>
            <input type="checkbox" class="switch" data-ev="sticky">
          </label>
          <div class="field"><span data-i18n="events.sound"></span>
            <div class="sound-row"><select id="evSound"></select><button class="icon-button" id="btnEvSound" data-i18n-title="sound.play">♪</button></div></div>
          <label class="switch-row">
            <span class="switch-text"><b data-i18n="general.sound"></b></span>
            <input type="checkbox" class="switch" data-path="sound.enabled">
          </label>
          <div class="row"><span class="label" data-i18n="general.volume"></span>
            <div class="inline"><input type="range" min="0" max="1" step="0.05" data-path="sound.volume"><output data-show="sound.volume" data-fmt="pct"></output></div></div>
        </div>
      </div>
    </aside>

    <section class="stage">
      <div class="stage-head">
        <div class="stage-title"><div><h2 data-i18n="preview.title"></h2><span class="label" data-i18n="preview.label"></span></div></div>
        <div class="button-row">
          <div class="segmented event-tabs" id="previewTabs"></div>
          <button class="icon-button" id="btnReplay" data-i18n-title="preview.replay">↻</button>
          <button class="icon-button" id="btnSound" data-i18n-title="preview.sound">♪</button>
          <button class="primary cta test" data-i18n-title="test.hint"><span data-i18n="preview.real"></span><span class="cta-icon">→</span></button>
        </div>
      </div>
      <div class="stage-canvas">
        <div class="desk" id="desk"></div>      </div>
      <div class="stage-foot">
        <label class="field"><span data-i18n="preview.project"></span><input type="text" id="sampleProject" value="next-notify"></label>
        <label class="field"><span data-i18n="preview.sample"></span><input type="text" id="sampleText"></label>
      </div>
    </section>
  </div>

  <footer class="footer">
    <span class="footer-meta"><span class="label" id="footVersion" lang="en"></span><span data-i18n="footer.rights"></span></span>
    <a class="maker" href="https://nextofuture.com" target="_blank">next to future</a>
  </footer>
</div>

<div class="sheet" id="setupSheet" role="dialog" aria-modal="true" aria-labelledby="setupTitle" hidden>
  <div class="sheet-body">
    <header class="sheet-head">
      <div><h2 id="setupTitle" data-i18n="setup.title"></h2><p class="hint" data-i18n="setup.intro"></p></div>
      <button class="icon-button" id="btnSetupClose" data-i18n-title="setup.close">✕</button>
    </header>
    <div class="tiles">
      <div class="tile"><span class="label" data-i18n="setup.app"></span><b><i class="state" id="appState"></i><span id="appStatus"></span></b></div>
      <div class="tile"><span class="label" data-i18n="setup.agents"></span><b><i class="state" id="agentsState"></i><span id="agentsStatus"></span></b></div>
      <div class="tile"><span class="label" data-i18n="setup.lastHook"></span><b><i class="state" id="hookState"></i><span id="lastHook"></span></b></div>
    </div>
    <ol class="steps">
      <li class="step"><span class="step-n">1</span><div class="switch-text step-body"><b data-i18n="setup.step.app"></b><small data-i18n="setup.step.app.hint"></small></div></li>
      <li class="step"><span class="step-n">2</span><div class="switch-text step-body"><b data-i18n="setup.step.connect"></b>
        <div class="segmented agent-tabs" id="agentTabs"></div>
        <div class="agent-setup" id="agentSetup"></div></div></li>
      <li class="step"><span class="step-n">3</span><div class="switch-text step-body"><b data-i18n="setup.step.session"></b><small data-i18n="setup.step.session.hint"></small>
        <div class="button-row"><button class="primary cta test" data-i18n-title="test.hint"><span data-i18n="test.send"></span><span class="cta-icon">→</span></button></div></div></li>
    </ol>
    <span class="label" id="version" lang="en"></span>
  </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
